interface:
  display_name: "Flova教程剪辑包装小助手"
  short_description: "Flova 产品内容指导与教程剪辑包装，支持自然旁白、配乐生成及多项目页面录制"
  default_prompt: "使用 $flova-tutorial-assistant，先根据包内产品知识讲清价值与玩法，优先包装实机录屏、其次截图、最后短段核心交互演示；默认中性黑底与局部虚化彩光动效、明显三维运镜、动态高亮和独立卡片动作，需要旁白时接通 Flova CLI 独立音频项目，默认 Seed Audio 1.0 多模态；需要录屏时可用包内 Chrome 扩展分项目录制并主动暂停等待。导出前检查源素材四边、运镜裁切与 PPT 感，只使用这个 Skill。"
